name: interieurstudio

services:
  caddy:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Configureer CADDY_SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${STUDIO_DATA_DIR:?Configureer STUDIO_DATA_DIR in .env}/caddy
        target: /data
      - type: bind
        source: ${STUDIO_DATA_DIR:?Configureer STUDIO_DATA_DIR in .env}/caddy-config
        target: /config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: "0.50"
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment: &api_environment
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Configureer PUBLIC_BASE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Configureer AUTH_SECRET in .env}
      DATABASE_URL: postgresql://studio_runtime:${RUNTIME_DATABASE_PASSWORD:?Configureer RUNTIME_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-interieurstudio}
      AUTH_DATABASE_URL: postgresql://studio_auth:${AUTH_DATABASE_PASSWORD:?Configureer AUTH_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-interieurstudio}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-4311}
      QUOTE_CHROMIUM_PATH: ${QUOTE_CHROMIUM_PATH:-/usr/bin/chromium}
      PREPARE_STORAGE: "1"
    volumes:
      - type: bind
        source: ${STUDIO_DATA_DIR:?Configureer STUDIO_DATA_DIR in .env}/assets
        target: /app/work/assets
    networks: [edge, private]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./infra/docker/chromium-seccomp.json
    mem_limit: 1g
    cpus: "2.00"
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4311/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["pnpm", "db:migrate"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgresql://studio_migrator:${MIGRATION_DATABASE_PASSWORD:?Configureer MIGRATION_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-interieurstudio}
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: "1.00"
    logging: *logging

  postgres:
    image: postgres:17.5-bookworm@sha256:0145b2977c9b49729ff8f8edc3b1192691eff92c1039bc969e25ae64bd7cbbe9
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interieurstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configureer POSTGRES_PASSWORD in .env}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Configureer MIGRATION_DATABASE_PASSWORD in .env}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Configureer RUNTIME_DATABASE_PASSWORD in .env}
      AUTH_DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Configureer AUTH_DATABASE_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - type: bind
        source: ${STUDIO_DATA_DIR:?Configureer STUDIO_DATA_DIR in .env}/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: ./infra/docker/postgres-init.sh
        target: /docker-entrypoint-initdb.d/10-roles.sh
        read_only: true
    networks: [private]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: "2.00"
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  edge:
  private:
    internal: true
