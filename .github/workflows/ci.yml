name: Foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Ubuntu 24.04 verbiedt onbevoorrechte gebruikersnamespaces via AppArmor,
      # waardoor Chromium zijn sandbox niet kan opzetten. De offerte-PDF wordt
      # bewust met sandbox gemaakt; die zetten we niet uit om de bouwstraat
      # tevreden te stellen. Chromium noemt dit zelf de aangewezen oplossing:
      # richt de omgeving in op sandboxen.
      - name: Sta de Chromium-sandbox toe op de runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      - run: pnpm probe:quote
      # De offerte-PDF wordt niet alleen gemaakt maar ook nagemeten: unieke
      # posten, het exacte totaal, geen lege pagina en een schaalbalk die op
      # papier werkelijk 100 mm lang is. Zonder deze stap kan een lay-outfout
      # het planblad ongemerkt verkleinen.
      - run: pip install --disable-pip-version-check pdfplumber==0.11.10
      - run: python3 scripts/verify-quote-pdf.py
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
